name: Skool maintenance

# BELT AND BRACES ONLY. The real schedule for all of this now lives inside the `Skool sync`
# chain, which fires each job once a day off an atomic claim ref. These crons stay as a
# fallback, but nothing depends on them any more.
#
# WHY: this workflow had total_count == 0. BOTH of the daily join count's cron slots
# (19 Sept 07:30 UTC, 20 Sept 06:20 UTC) were silently dropped by GitHub, so the number
# that tells us the funnel is alive was never produced - while the launchd agent that used
# to produce it had already been retired. That is the same dropped-cron problem the sync
# chain was rebuilt to escape, and maintenance was still standing in it.
#
# The 60-page deep scan is deliberately not here either. Everything that writes lives inside
# the sync loop, because that loop is the single serialised writer and Close's search index
# lags writes by minutes - anything running concurrently with a 5-minute pass would read
# "not in Close" for a lead that pass had just created, and duplicate it.
on:
  schedule:
    - cron: "20 6 * * *"      # daily  06:20 UTC - pipeline hygiene
    - cron: "30 7 * * *"      # daily  07:30 UTC (08:30 London) - yesterday's join count
    - cron: "0 8 * * 1"       # Monday 08:00 UTC - weekly attribution digest
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run on demand"
        type: choice
        options: [both, hygiene, digest, daily]
        default: both

# Same group as the sync chain, so pipeline_advance.py can never move cards while the loop
# is creating them. This project has already been bitten once by two writers racing on Close.
#
# The consequence is that the chain, which is always live, will normally starve this workflow
# out - a queued run here is superseded by the chain's next hand-off. That is deliberate and
# costs nothing, because the chain already does this work on a claim. To run one of these ON
# DEMAND, dispatch `Skool sync` with force_hygiene / force_digest instead of dispatching this.
concurrency:
  group: skool-sync
  cancel-in-progress: false

jobs:
  hygiene:
    # daily cron, or a manual run asking for it
    if: github.event.schedule == '20 6 * * *' || github.event_name == 'workflow_dispatch' && (inputs.job == 'both' || inputs.job == 'hygiene')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      # Moves cards out of "New Member": members who left Skool -> Not A Fit / Left,
      # and cards >= 21 days old whose member has zero community points -> Unresponsive.
      # Matched on Skool handle, not email, so the Apr-Aug back catalogue is not
      # mistaken for departures. Capped so a bad day cannot rewrite the whole board.
      - name: Pipeline hygiene
        env:
          SKOOL_COOKIE:    ${{ secrets.SKOOL_COOKIE }}
          CLOSE_API_KEY:   ${{ secrets.CLOSE_API_KEY }}
          GHL_PIT:         ${{ secrets.GHL_PIT }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL:   ${{ secrets.SLACK_CHANNEL }}
        run: |
          # Stamp Skool Profile URLs first - departure detection keys on the handle, and
          # leads the old Zap created never had that field mapped. Without this the sweep
          # silently only covers the minority of the board that happens to carry one.
          python scripts/pipeline_advance.py --repair-urls --apply
          python scripts/pipeline_advance.py --apply --stale-days 21 --max-moves 150

  daily:
    # Replaces the Mac launchd agent com.dealengine.skool-daily-count (08:30 London).
    if: github.event.schedule == '30 7 * * *' || github.event_name == 'workflow_dispatch' && inputs.job == 'daily'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Yesterday's joins
        env:
          SKOOL_COOKIE:    ${{ secrets.SKOOL_COOKIE }}
          CLOSE_API_KEY:   ${{ secrets.CLOSE_API_KEY }}
          GHL_PIT:         ${{ secrets.GHL_PIT }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL:   ${{ secrets.SLACK_CHANNEL }}
        run: python scripts/attribution_digest.py --days 1 --post

  digest:
    if: github.event.schedule == '0 8 * * 1' || github.event_name == 'workflow_dispatch' && (inputs.job == 'both' || inputs.job == 'digest')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Weekly attribution digest
        env:
          SKOOL_COOKIE:    ${{ secrets.SKOOL_COOKIE }}
          CLOSE_API_KEY:   ${{ secrets.CLOSE_API_KEY }}
          GHL_PIT:         ${{ secrets.GHL_PIT }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL:   ${{ secrets.SLACK_CHANNEL }}
        run: python scripts/attribution_digest.py --days 7 --post
