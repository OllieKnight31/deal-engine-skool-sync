name: Skool sync

# WHY THIS IS A SELF-DISPATCHING CHAIN AND NOT A CRON
# GitHub's `schedule` trigger is best-effort and openly de-prioritised. Measured on this
# repo over 19-20 Sept the hourly "7 * * * *" cron fired with gaps of 246, 288, 201, 172,
# 181 and 162 minutes - and nothing at all between 01:00Z and 05:50Z. Each run only covers
# ~55 minutes of internal polling, so real coverage was ~28% of the clock.
#
# So the cadence does not depend on cron at all. Each run polls internally for ~55 minutes
# and then DISPATCHES ITS OWN SUCCESSOR, exactly as OllieKnight31/speed-to-lead-pinger does
# (proven: a clean unbroken ~50-minute chain over 24h). The `*/15` cron below is only a
# restarter for the case where the chain is ever broken - a cancelled run, a GitHub-side
# kill, or a disabled schedule - and `concurrency` collapses the duplicates it creates.
#
# This also replaces the Mac launchd agents com.dealengine.{skool-ghl-sync, skool-reconcile,
# skool-ghl-deepscan, ghl-close-sync}, which only achieved 24-42% coverage because the
# MacBook sleeps when the lid closes.
on:
  schedule:
    - cron: "*/15 * * * *"        # restarter ONLY - the chain is what provides the cadence
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: "minutes to poll before handing off (0 = one pass then hand off)"
        default: "55"
      interval:
        description: "seconds between passes"
        default: "120"
      deep:
        description: "force the full-list deep scan (still honours the once-a-day claim)"
        type: boolean
        default: false
      force_hygiene:
        description: "force pipeline hygiene (still honours the once-a-day claim)"
        type: boolean
        default: false
      force_digest:
        description: "force the daily join count (still honours the once-a-day claim)"
        type: boolean
        default: false
      force_weekly:
        description: "force the Monday attribution digest (still honours the claim)"
        type: boolean
        default: false
      handoff:
        description: "dispatch a successor when this run ends"
        type: boolean
        default: true

concurrency:
  group: skool-sync
  cancel-in-progress: false       # never let two runs write at once

permissions:
  contents: write                 # creates the atomic once-a-day claim refs (see below)
  actions: write                  # lets the run dispatch its successor

jobs:
  sync:
    runs-on: ubuntu-latest
    # 95 = 55m loop + headroom for a full-list deep pass (63 pages on 21 Sept, and growing).
    # Kept at 95 rather than cut back, because the job timeout is no longer the thing keeping
    # a run honest - every python call below now has its own `timeout`, so the loop cannot
    # run away even when one call hangs. This is the backstop, not the guard.
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # phonenumbers MUST be present - skool_to_ghl.py exits hard without it rather than
      # silently discarding every phone number.
      - run: pip install -r requirements.txt

      # The polling loop. Work is tiered so the 5-minute lead path stays fast while the
      # slower sweeps that used to be separate launchd agents still happen:
      #
      #   every pass   (~3 min)  reconcile_skool.py --pages 3  --fix   + phone normalise
      #   every 5th    (~15 min) ghl_dfy_to_close.py --apply           <- was ghl-close-sync
      #                          ghl_stage_mirror.py --apply           <- GHL stage -> Close
      #   every 10th   (~30 min) reconcile_skool.py --pages 8  --fix   <- was skool-reconcile
      #                                                                   and skool-ghl-sync
      #
      # INTERVAL WAS 300s AND IS NOW 120s. Measured on run 35564726300 the real pass-to-pass
      # gap was 5m36s-6m42s: the 300s sleep plus 36-100s of work. The blocker on shortening
      # it was NOT rate limits, it was Close: in_close() is a SEARCH, the search index lags
      # writes by minutes, so a lead created on one pass could look missing on the next and
      # be created twice. reconcile_skool.py now remembers what it just created and re-reads
      # those by id (strongly consistent), so the interval no longer has to be longer than
      # Close's index lag. Real cadence is now ~2m40s-3m40s, and the tier divisors above were
      # re-cut so the heavier sweeps keep the 15- and 30-minute spacing they were chosen for.
      #   once/day 04:00 UTC     reconcile_skool.py --pages 0  --fix   <- was skool-ghl-deepscan
      #                          (0 = all pages; see DEEP_PAGES below)
      #   once/day 06:20 UTC     pipeline_advance.py                   <- was maintenance.yml cron
      #   once/day 07:30 UTC     attribution_digest.py --days 1 --post <- was skool-daily-count
      #   Mondays  08:00 UTC     attribution_digest.py --days 7 --post <- was maintenance.yml cron
      #
      # The three once-a-day jobs were all stranded on GitHub cron, which drops runs. The
      # daily join count in particular had NEVER fired: `Skool maintenance` had
      # total_count == 0, so both of its cron slots were dropped and nobody produced the
      # number that tells us the funnel is alive. They now ride the chain instead.
      #
      # A failing pass does NOT stop the loop - the next one retries and every write is
      # idempotent - but the job still ends red, so a real breakage is loud rather than
      # wearing the costume of a clean run.
      - name: Sync loop
        env:
          SKOOL_COOKIE:    ${{ secrets.SKOOL_COOKIE }}
          CLOSE_API_KEY:   ${{ secrets.CLOSE_API_KEY }}
          GHL_PIT:         ${{ secrets.GHL_PIT }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL:   ${{ secrets.SLACK_CHANNEL }}
          LOOP_MINUTES:    ${{ inputs.loop_minutes || '55' }}
          INTERVAL:        ${{ inputs.interval || '120' }}
          GH_TOKEN:        ${{ github.token }}
          FORCE_DEEP:      ${{ inputs.deep && 'yes' || 'no' }}
          FORCE_HYGIENE:   ${{ inputs.force_hygiene && 'yes' || 'no' }}
          FORCE_DIGEST:    ${{ inputs.force_digest && 'yes' || 'no' }}
          FORCE_WEEKLY:    ${{ inputs.force_weekly && 'yes' || 'no' }}
          DEEP_AT:         "04:00"  # UTC. Arbitrary in CI - there is no machine to wake.
          HYGIENE_AT:      "06:20"  # matches the maintenance.yml cron it supersedes
          DIGEST_AT:       "07:30"  # 08:30 London - matches com.dealengine.skool-daily-count
          WEEKLY_AT:       "08:00"  # Mondays only - matches the maintenance.yml cron
          # 0 = every page there is. The community was 63 pages on 21 Sept and grows ~43/day,
          # so "60" had already stopped covering the list. Never hardcode this again.
          DEEP_PAGES:      "0"
        run: |
          set -u
          END=$(( $(date +%s) + LOOP_MINUTES * 60 ))
          FAILED=0; PASS=0; SKIPPED=0
          DONE_deepscan=0; DONE_hygiene=0; DONE_digest=0; DONE_weekly=0

          # --- once-a-day jobs, guarded by an ATOMIC server-side claim ------------------
          # A run lasts ~55 min, so two consecutive runs can both be alive inside the same
          # hour - an in-run flag alone would double-post the join count to Slack. Creating
          # a git ref is atomic on GitHub's side: the first caller gets 201, every other
          # caller gets 422 "Reference already exists". That is the guard, and it survives
          # restarts, overlapping runs and the */15 cron because it lives on the server.
          # refs/daily-claim/<slot>/<UTC date> is its own ref namespace, so it shows up as
          # neither a tag nor a branch. It also doubles as an audit trail: "did the digest
          # go out on the 19th?" is answerable by listing the refs.
          hm()      { echo $(( 10#${1%%:*} * 60 + 10#${1##*:} )); }
          # 0 = we own today's slot, 1 = somebody already does, 2 = the claim itself is
          # BROKEN. That third case has to be its own answer: collapsing it into "already
          # done" would silently disable all three daily jobs forever the moment the API
          # or the token changed, which is the same dead-pipe-reads-as-healthy failure the
          # rest of this codebase is built to refuse.
          claim() {
            local out rc=0
            out=$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
                    -f ref="refs/daily-claim/$1/$DAY" -f sha="$GITHUB_SHA" 2>&1) || rc=$?
            if [ "$rc" = "0" ]; then return 0; fi
            case "$out" in *"Reference already exists"*) return 1;; esac
            echo "::error::$1 claim could not be taken and it is NOT a duplicate: $out"
            return 2
          }
          release() { gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/daily-claim/$1/$DAY" \
                        >/dev/null 2>&1 || true; }

          # daily <slot> <at_minutes> <description> <command...>
          # Fires once the clock is PAST the slot time rather than exactly on it, so a job
          # is caught up rather than silently skipped for the day if the chain was down at
          # the appointed minute. Explicit `if` blocks, never `[ ... ] && return`, because a
          # false test as a function's last command returns 1 and `set -e` would kill the run.
          daily() {
            local slot=$1 at=$2 desc=$3; shift 3
            local flag="DONE_$slot"
            if [ "${!flag}" = "1" ]; then return 0; fi
            if [ "$NOW_HM" -lt "$at" ]; then return 0; fi
            local c=0
            claim "$slot" || c=$?
            if [ "$c" = "1" ]; then
              printf -v "$flag" 1
              echo "  [$slot] already done today - skipping ($desc)"
              return 0
            fi
            if [ "$c" != "0" ]; then
              printf -v "$flag" 1
              FAILED=1
              echo "::error::[$slot] NOT RUN - the once-a-day claim is unavailable. Refusing to"
              echo "::error::run it unguarded rather than risk posting to Slack twice. Fix the claim."
              return 0
            fi
            echo "::group::$desc  $(date -u +%H:%M:%SZ)"
            if "$@"; then
              printf -v "$flag" 1
              echo "$slot completed at $(date -u +%H:%M:%SZ)"
            else
              printf -v "$flag" 1   # do not retry inside THIS run
              release "$slot"       # but let a LATER run retry today
              FAILED=1
              echo "::error::$slot FAILED - claim released so a later run retries"
            fi
            echo "::endgroup::"
            return 0
          }

          while :; do
            PASS=$((PASS+1))
            PAGES=3
            [ $(( PASS % 10 )) -eq 0 ] && PAGES=8

            # 10# on both sides: an hour written "04" or "08" must still compare correctly,
            # and bare $((08)) is an octal error in bash. Recomputed every pass so a run
            # that spans midnight UTC claims against the right day.
            DAY=$(date -u +%F)
            NOW_HM=$(( 10#$(date -u +%H) * 60 + 10#$(date -u +%M) ))
            DEEP_HM=$(hm "$DEEP_AT"); HYG_HM=$(hm "$HYGIENE_AT"); DIG_HM=$(hm "$DIGEST_AT")
            WEEKLY_HM=$(hm "$WEEKLY_AT")
            if [ "$FORCE_WEEKLY"  = "yes" ]; then WEEKLY_HM=0; fi
            if [ "$FORCE_DEEP"    = "yes" ]; then DEEP_HM=0; fi
            if [ "$FORCE_HYGIENE" = "yes" ]; then HYG_HM=0;  fi
            if [ "$FORCE_DIGEST"  = "yes" ]; then DIG_HM=0;  fi

            echo "::group::pass $PASS  $(date -u +%H:%M:%SZ)  pages=$PAGES  utc_min=$NOW_HM  deep@$DEEP_HM/$DONE_deepscan  hygiene@$HYG_HM/$DONE_hygiene  digest@$DIG_HM/$DONE_digest"
            # EVERY python call is wrapped in `timeout`. This is what actually went wrong on
            # 22 Sept: a pass hung on a socket with no deadline, the run sat at 92 minutes
            # against a 55-minute budget, and because `concurrency` lets nothing else start,
            # the whole Skool intake stopped until someone force-cancelled it by hand. A
            # single hung HTTP call must cost one pass, not the chain. `timeout` exits 124,
            # which the existing `||` branches already treat as a failed pass.
            # Exit 75 (EX_TEMPFAIL) is reconcile_skool.py saying "Skool's WAF is refusing me,
            # I skipped this pass" - a deliberate, designed outcome, not a fault. It already
            # counts consecutive skips itself and alarms in Slack only after three in a row.
            # Treating it as a failure here would paint every run red on a single 40ms 403,
            # and a run colour that is red most of the time tells nobody anything the next
            # time it is red for a real reason.
            RC=0; timeout 300 python scripts/reconcile_skool.py --pages "$PAGES" --fix || RC=$?
            if [ "$RC" = "0" ]; then
              :
            elif [ "$RC" = "75" ]; then
              SKIPPED=$((SKIPPED+1))
              echo "::notice::Skool unavailable - pass $PASS skipped (the script alarms if this persists)"
            else
              FAILED=1
              echo "::warning::reconcile (pages $PAGES) failed or timed out on pass $PASS (exit $RC)"
            fi
            timeout 300 python scripts/close_phone_normalise.py --apply          || { FAILED=1; echo "::warning::phone normalise failed or timed out on pass $PASS"; }

            # Mirrors the GHL Setter Pipeline (DFY / Mentorship applications) into Close.
            # 15 minutes matches the launchd agent it replaces; it pages the whole Close
            # lead list, so it is deliberately not run on every pass.
            if [ $(( PASS % 5 )) -eq 1 ]; then
              timeout 420 python scripts/ghl_dfy_to_close.py --apply || { FAILED=1; echo "::warning::ghl->close mirror failed or timed out on pass $PASS"; }
              # Propagate STAGE changes GHL -> Close on the two mirrored boards. The line
              # above only ever CREATES a card, so without this the boards agree the moment
              # a lead arrives and drift apart the instant anything moves: on 21 Sept, 65
              # people sat in "Welcome DM Sent" in GHL and 0 in Close, and the gap grew daily.
              timeout 420 python scripts/ghl_stage_mirror.py --apply || { FAILED=1; echo "::warning::stage mirror failed or timed out on pass $PASS"; }
            fi
            echo "::endgroup::"

            # The 60-page deep scan. On the Mac this NEVER once succeeded: it fired at 04:30
            # while the machine was in Deep Idle, DarkWoke for ~45s with no DNS, and died on
            # socket.gaierror. All three of these live INSIDE the loop on purpose: the loop
            # is the single serialised writer, and Close's search index lags writes by
            # minutes, so anything running CONCURRENTLY with the 5-minute pass would read
            # "not in Close" for a lead that pass had just created, and duplicate it.
            daily deepscan "$DEEP_HM" "DEEP SCAN  $DEEP_PAGES pages" \
              timeout 2400 python scripts/reconcile_skool.py --pages "$DEEP_PAGES" --fix

            # Pipeline hygiene. Repair the Skool Profile URLs first - departure detection
            # keys on the handle, and leads the old Zap created never had that field mapped.
            daily hygiene "$HYG_HM" "PIPELINE HYGIENE" \
              bash -c 'timeout 900 python scripts/pipeline_advance.py --repair-urls --apply &&
                       timeout 900 python scripts/pipeline_advance.py --apply --stale-days 21 --max-moves 150'

            # The daily join count. This is the number that tells us the funnel is alive,
            # and it posts to Slack - which is exactly why the claim above has to be atomic
            # rather than a flag in this shell.
            daily digest "$DIG_HM" "DAILY JOIN COUNT" \
              timeout 600 python scripts/attribution_digest.py --days 1 --post

            # The Monday attribution digest. Same once-a-day claim - the claim key is the
            # date, and there is only one Monday per week, so it needs no new mechanism.
            # It rides the chain for the same reason as the rest: maintenance.yml now shares
            # this workflow's concurrency group, so a cron there will normally be superseded
            # by the chain's next hand-off and cannot be depended on.
            if [ "$(date -u +%u)" = "1" ] || [ "$FORCE_WEEKLY" = "yes" ]; then
              daily weekly "$WEEKLY_HM" "WEEKLY ATTRIBUTION DIGEST" \
                timeout 600 python scripts/attribution_digest.py --days 7 --post
            fi

            # Explicit, because `[ ... ] && sleep` as the loop's last command returns 1 on
            # the final pass and marked every healthy run in the pinger repo as failed.
            NOW=$(date +%s)
            if [ "$NOW" -ge "$END" ]; then break; fi
            sleep "$INTERVAL"
          done

          # A skip is fine; a run where EVERY pass was skipped did no work at all, and that
          # must be red however politely each individual pass declined.
          if [ "$PASS" -gt 0 ] && [ "$SKIPPED" -eq "$PASS" ]; then
            FAILED=1
            echo "::error::all $PASS passes skipped - Skool was unavailable for this entire run"
          fi

          echo "skipped $SKIPPED of $PASS passes"
          echo "completed $PASS passes; deepscan=$DONE_deepscan hygiene=$DONE_hygiene digest=$DONE_digest weekly=$DONE_weekly"
          exit $FAILED

      # Hand off after success OR failure, but never after a cancel: cancelling a run must
      # be able to stop the chain by hand. If GitHub itself kills a run, the */15 cron
      # restarts it. Defaults are used deliberately - a short test run hands off to a
      # normal-length successor.
      - name: Hand off to the next run
        if: ${{ !cancelled() && (inputs.handoff == null || inputs.handoff) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run sync.yml --repo "$GITHUB_REPOSITORY" --ref main
          # The health check rides the hand-off too. health.yml was written to fire on
          # workflow_run when this run completes, and it never did (run #105, 23 Sept):
          # GitHub suppresses events raised by runs that GITHUB_TOKEN itself dispatched,
          # which is every run in this chain. workflow_dispatch is the one trigger that
          # rule exempts - the same reason the line above works at all.
          gh workflow run health.yml --repo "$GITHUB_REPOSITORY" --ref main \
            || echo "::warning::could not dispatch the health check - its 3-hourly cron is the only backstop"
